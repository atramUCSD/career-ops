<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-ops board</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f3; --fg: #1c1c1a; --muted: #6d6c66; --card: #fff; --line: #e1e0da; --accent: #2d6a4c; --warn: #9a3b1b; --wait: #8a6d1a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #ebeae5; --muted: #9b9a93; --card: #1f1f1d; --line: #30302c; --accent: #82c4a2; --warn: #f0a07f; --wait: #e2c26b; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* #board's display: grid would beat the attribute */
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 16px; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  h1 { margin: 0; font-size: 18px; }
  #status { color: var(--muted); font-size: 13px; }
  #board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; padding: 0 16px 40px; align-items: start; }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; margin: 0; }
  details.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
  details.card > summary { list-style: none; cursor: pointer; padding: 10px 12px; }
  details.card > summary::-webkit-details-marker { display: none; }
  .co { font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .pending { color: var(--wait); font-size: 13px; }
  .failed { color: var(--warn); font-size: 13px; }
  .body { padding: 0 12px 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .body p { margin: 10px 0 0; overflow-wrap: anywhere; }
  .body a { color: var(--accent); }
  form { display: flex; gap: 8px; margin-top: 10px; }
  select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  select, textarea { flex: 1; min-width: 0; }
  textarea { resize: vertical; min-height: 2.4em; }
  button { cursor: pointer; }
  ol { margin: 10px 0 0; padding-left: 18px; }
  li { margin-bottom: 4px; }
  li time { color: var(--muted); font-size: 12px; display: block; }
  details.more > summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0 8px; }
  #status.stale { color: var(--warn); }
  #status a { color: var(--accent); }
  #postings { padding: 0 16px 40px; max-width: 760px; }
  #saved:not(:empty) { margin-bottom: 20px; }
  #postings input { width: 100%; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  #tabs { display: flex; gap: 4px; padding: 0 16px 12px; }
  #tabs a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 14px; }
  #tabs a[aria-current] { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .post { display: block; padding: 8px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
</style>
</head>
<body>
<header><h1>career-ops board</h1><span id="status">Loading…</span></header>
<nav id="tabs" hidden><a href="#">Board</a><a href="#postings" id="tab-postings">Postings</a></nav>
<main id="board"></main>
<section id="postings" hidden>
  <div id="saved"></div>
  <h2 id="postings-h"></h2>
  <input id="q" type="search" placeholder="Filter by company, title or location" aria-label="Filter postings">
  <div id="postings-list"></div>
</section>
<script>
  // View of the copy the PC pushes (ADR-001 step 2), plus the inbox (step 5): moves
  // and comments queue in the store, draw as pending, and settle when the PC's runner
  // reports back. Built with DOM nodes, never innerHTML: tracker notes and report
  // headers are text from job postings.
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs ?? {})) if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
    n.append(...kids.filter((k) => (typeof k === 'string' ? k !== '' : k instanceof Node)));
    return n;
  };
  const ago = (iso) => {
    const mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
    const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
    return mins < 60 ? rtf.format(-mins, 'minute') : mins < 2880 ? rtf.format(-Math.round(mins / 60), 'hour') : rtf.format(-Math.round(mins / 1440), 'day');
  };
  const httpUrl = (u) => (/^https?:\/\//.test(u ?? '') ? u : null);
  const open = new Set(); // cards the user expanded survive a re-render
  let states = [];
  let actions = [];
  let lastDrawn = '';

  // A rejection stays on its card for a day: long enough to be seen on the next
  // look, short enough not to pile up. Stale means the desk moved the card first.
  const DAY = 86_400_000;
  function outcomeText(a) {
    const what = a.type === 'move' ? `Move to ${a.payload.to}` : 'Comment';
    if (a.status === 'pending') return `${what}: waiting for the PC`;
    const r = a.result ?? {};
    if (r.reason === 'stale') return `${what} not applied: the card is at ${r.current ?? 'another state'} now, not ${r.expected}.`;
    return `${what} not applied: ${r.message ?? r.reason ?? 'rejected'}`;
  }

  async function send(body) {
    const res = await fetch('/api/inbox', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? `HTTP ${res.status}`);
    actions = [await res.json(), ...actions];
    draw();
  }

  function moveForm(app) {
    const current = states.find((s) => s.label.toLowerCase() === String(app.status).toLowerCase());
    const select = el('select', { 'aria-label': 'Move to' }, ...states.map((s) => el('option', { value: s.label, selected: s === current }, s.label)));
    const form = el('form', null, select, el('button', null, 'Move'));
    form.onsubmit = (e) => {
      e.preventDefault();
      const to = states.find((s) => s.label === select.value);
      if (!to || to === current) return;
      if (to.terminal && !confirm(`Move ${app.company} to ${to.label}?`)) return;
      send({ uuid: crypto.randomUUID(), type: 'move', payload: { n: app.n, to: to.label }, precondition: { from: app.status } })
        .catch((err) => alert(`Could not queue the move: ${err.message}`));
    };
    return form;
  }

  function commentForm(app) {
    const text = el('textarea', { 'aria-label': 'Comment', maxlength: 2000, rows: 1, placeholder: 'Comment' });
    const form = el('form', null, text, el('button', null, 'Add'));
    form.onsubmit = (e) => {
      e.preventDefault();
      if (!text.value.trim()) return;
      send({ uuid: crypto.randomUUID(), type: 'comment', payload: { n: app.n, text: text.value } })
        .then(() => (text.value = ''), (err) => alert(`Could not queue the comment: ${err.message}`));
    };
    return form;
  }

  function card({ app, meta, timeline }) {
    const url = httpUrl(app.url) ?? httpUrl(meta.header.URL);
    const sub = [app.score, app.status, app.date].filter(Boolean).join(' · ');
    const mine = actions.filter((a) => a.payload?.n === app.n);
    const notes = mine.filter((a) => a.status === 'pending' || (a.status === 'rejected' && Date.now() - Date.parse(a.resolvedAt) < DAY));
    const d = el('details', { class: 'card', open: open.has(app.n) },
      el('summary', null, el('div', { class: 'co' }, app.company), el('div', null, app.role), el('div', { class: 'sub' }, sub),
        ...notes.map((a) => el('div', { class: a.status === 'pending' ? 'pending' : 'failed', role: 'status' }, outcomeText(a)))),
      el('div', { class: 'body' },
        moveForm(app),
        commentForm(app),
        url && el('p', null, el('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Posting')),
        app.location && el('p', null, app.location),
        app.followUp && el('p', null, `Follow up: ${app.followUp}`),
        app.notes && el('p', null, app.notes),
        timeline.length && el('ol', null, ...timeline.map((e) =>
          el('li', null, el('time', null, e.dated ? e.at : new Date(e.at).toLocaleString()), e.title, e.detail ? ` (${e.detail})` : null))),
      ),
    );
    d.ontoggle = () => (d.open ? open.add(app.n) : open.delete(app.n));
    return d;
  }

  // The last copy and inbox this phone saw live in Cache Storage, so the page opens on
  // them at once and keeps showing them while offline or after the Access session
  // lapses (sw.js serves the shell in both cases). A revalidation swaps the copy only
  // on a 200; a 304 just refreshes how recently the PC pushed.
  const SNAP = 'snapshot-v1';
  const STALE_MS = 12 * 3_600_000;
  let copy = { pushedAt: null, rows: [] };
  let etag = null;
  let copyRev = 0;
  let checkedAt = null; // when this phone last reached the server
  let mode = 'loading'; // live | offline | signed-out | error
  let modeDetail = '';

  async function snapshot(key, text, headers) {
    if (!('caches' in self)) return;
    try {
      await (await caches.open(SNAP)).put(key, new Response(text, { headers }));
    } catch {} // storage full or blocked: the page still works, it just opens empty offline
  }

  async function restore() {
    if (!('caches' in self)) return;
    const cache = await caches.open(SNAP);
    const [c, i, m] = await Promise.all(['/api/copy', '/api/inbox', '/meta'].map((k) => cache.match(k)));
    if (c) {
      copy = await c.json();
      etag = c.headers.get('etag');
      copyRev++;
    }
    if (i) actions = await i.json();
    if (m) {
      const meta = await m.json(); // pushedAt rides in a header, so only /meta keeps it
      copy.pushedAt = meta.pushedAt ?? copy.pushedAt;
      checkedAt = meta.checkedAt;
    }
  }

  function drawStatus() {
    const s = document.getElementById('status');
    const cards = copy.rows.filter((r) => r.kind === 'card');
    const off = cards.filter((r) => !r.data.lane).length;
    const waiting = actions.filter((a) => a.status === 'pending').length;
    const stale = copy.pushedAt && Date.now() - Date.parse(copy.pushedAt) > STALE_MS;
    const lead = {
      live: '',
      loading: copyRev ? 'Snapshot, checking for a newer copy' : 'Loading…',
      offline: copyRev ? `Offline, showing the snapshot checked ${checkedAt ? ago(checkedAt) : 'earlier'}` : 'Offline and no snapshot yet',
      'signed-out': copyRev ? `Signed out, showing the snapshot checked ${checkedAt ? ago(checkedAt) : 'earlier'}` : 'Signed out',
      error: `Could not load the copy (${modeDetail})`,
    }[mode];
    s.className = stale || mode !== 'live' ? 'stale' : '';
    s.replaceChildren(...[
      lead,
      copy.pushedAt ? `PC last pushed ${ago(copy.pushedAt)}` : copyRev ? 'Nothing pushed yet' : '',
      waiting ? `${waiting} waiting for the PC` : '',
      off ? `${off} discarded or skipped off the board` : '',
    ].filter(Boolean).join(' · '));
    // ?signin skips sw.js, so the navigation reaches Access and its login page.
    if (mode === 'signed-out') s.append(' · ', el('a', { href: '/?signin' }, 'Sign in'));
  }

  function draw() {
    drawStatus();
    // Skip identical redraws so a poll never resets a half-typed comment.
    const key = JSON.stringify([copyRev, actions]);
    if (key === lastDrawn) return;
    lastDrawn = key;
    const byId = Object.fromEntries(copy.rows.filter((r) => r.kind !== 'posting').map((r) => [r.id, r.data]));
    states = byId.states ?? [];
    const cards = copy.rows.filter((r) => r.kind === 'card').map((r) => r.data).sort((a, b) => b.app.date.localeCompare(a.app.date));
    const board = document.getElementById('board');
    board.replaceChildren();
    for (const col of byId.columns ?? []) {
      const mine = cards.filter((c) => c.lane === col.id);
      const live = col.id === 'rejected' ? [] : mine.filter((c) => !c.skip);
      const parked = col.id === 'rejected' ? mine : mine.filter((c) => c.skip);
      board.append(el('section', null,
        el('h2', null, `${col.label} ${mine.length}`),
        ...live.map(card),
        !mine.length && el('p', { class: 'empty' }, 'None'),
        parked.length && el('details', { class: 'more' },
          el('summary', null, col.id === 'rejected' ? `Show ${parked.length}` : `${parked.length} the evaluator marked Skip`),
          ...parked.map(card)),
      ));
    }
    drawPostings();
  }

  // Thousands of postings: draw the best-scored matches only, never the whole list.
  const POSTINGS_SHOWN = 50;
  const daysSince = (day) => Math.floor((Date.now() - Date.parse(`${day}T00:00:00Z`)) / 86_400_000);
  function drawPostings() {
    const all = copy.rows.filter((r) => r.kind === 'posting').map((r) => r.data);
    document.getElementById('tab-postings').textContent = `Postings ${all.length}`;
    route();
    drawSaved(all);
    const q = document.getElementById('q').value.trim().toLowerCase();
    const hits = (q ? all.filter((p) => `${p.c} ${p.t} ${p.l}`.toLowerCase().includes(q)) : all).sort((a, b) => (b.cb ?? 0) - (a.cb ?? 0));
    document.getElementById('postings-h').textContent = q ? `Pending postings ${hits.length} of ${all.length}` : `Pending postings ${all.length}`;
    document.getElementById('postings-list').replaceChildren(...hits.slice(0, POSTINGS_SHOWN).map((p) => {
      const url = httpUrl(p.u);
      const sub = [p.l, p.p ? `posted ${daysSince(p.p)}d ago` : 'no posted date', p.band && `${p.band} ${p.cb}`, p.gov && 'public sector'].filter(Boolean).join(' · ');
      return el(url ? 'a' : 'div', { class: 'post', href: url, target: url && '_blank', rel: url && 'noopener noreferrer' },
        el('div', null, el('span', { class: 'co' }, p.c), ` ${p.t}`), el('div', { class: 'sub' }, sub));
    }), hits.length > POSTINGS_SHOWN ? el('p', { class: 'empty' }, `${hits.length - POSTINGS_SHOWN} more; filter to narrow`) : '');
  }
  document.getElementById('q').oninput = drawPostings;

  // The inbox shortlist from the PC (data/ui-state.json), above the filter so it stays put.
  function drawSaved(all) {
    const saved = copy.rows.find((r) => r.id === 'shortlist')?.data ?? [];
    const byUrl = new Map(all.map((p) => [p.u, p]));
    document.getElementById('saved').replaceChildren(...(saved.length ? [
      el('h2', null, `Shortlisted ${saved.length}`),
      ...saved.map((s) => {
        const url = httpUrl(s.url);
        const p = byUrl.get(s.url);
        const sub = p ? [p.l, p.band && `${p.band} ${p.cb}`].filter(Boolean).join(' · ') : 'no longer pending';
        return el(url ? 'a' : 'div', { class: 'post', href: url, target: url && '_blank', rel: url && 'noopener noreferrer' },
          el('div', null, el('span', { class: 'co' }, s.company), ` ${s.role}`), el('div', { class: 'sub' }, sub));
      }),
    ] : []));
  }

  // Two views on the hash, so the back button and a home-screen bookmark both work.
  // The tabs appear only once the copy carries postings.
  function route() {
    const any = copy.rows.some((r) => r.kind === 'posting');
    const postings = any && location.hash === '#postings';
    document.getElementById('tabs').hidden = !any;
    document.getElementById('board').hidden = postings;
    document.getElementById('postings').hidden = !postings;
    for (const a of document.querySelectorAll('#tabs a')) {
      if ((a.hash === '#postings') === postings) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
  }
  addEventListener('hashchange', route);

  // redirect: 'manual' because a lapsed Access session answers with a 302 to its login
  // page; followed, that is a cross-origin HTML page and the fetch fails as if offline.
  async function load() {
    let c, i;
    try {
      [c, i] = await Promise.all([
        fetch('/api/copy', { cache: 'no-store', redirect: 'manual', headers: etag ? { 'If-None-Match': etag } : {} }),
        fetch('/api/inbox', { cache: 'no-store', redirect: 'manual' }),
      ]);
    } catch {
      mode = 'offline';
      return draw();
    }
    if (c.type === 'opaqueredirect' || c.status === 401 || c.status === 403) {
      mode = 'signed-out';
      return draw();
    }
    // An exhausted D1 quota or a Pages fallback can answer 200 with an HTML page.
    const json = (r) => (r.headers.get('content-type') ?? '').includes('application/json');
    if (c.status === 304) {
      copy.pushedAt = c.headers.get('x-pushed-at') || copy.pushedAt;
    } else if (c.ok && json(c)) {
      const text = await c.text();
      copy = { ...JSON.parse(text), pushedAt: c.headers.get('x-pushed-at') || null };
      etag = c.headers.get('etag');
      copyRev++;
      await snapshot('/api/copy', text, etag ? { etag } : {});
    } else {
      [mode, modeDetail] = ['error', c.ok ? 'not JSON' : `HTTP ${c.status}`];
      return draw();
    }
    if (i.ok && json(i)) {
      const text = await i.text();
      actions = JSON.parse(text);
      await snapshot('/api/inbox', text);
    }
    mode = 'live';
    checkedAt = new Date().toISOString();
    await snapshot('/meta', JSON.stringify({ pushedAt: copy.pushedAt, checkedAt }));
    draw();
  }

  // Poll faster while something is waiting, so a settled move shows up soon after the runner reports it.
  async function tick() {
    await load().catch((err) => ([mode, modeDetail] = ['error', err.message], draw()));
    setTimeout(tick, actions.some((a) => a.status === 'pending') ? 10_000 : 60_000);
  }
  // A phone reopening the tab should not wait out the poll interval.
  document.addEventListener('visibilitychange', () => document.hidden || load().catch(() => {}));
  addEventListener('online', () => load().catch(() => {}));
  if (location.search.includes('signin')) history.replaceState(null, '', '/');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  restore().catch(() => {}).then(() => (draw(), tick()));
</script>
</body>
</html>
