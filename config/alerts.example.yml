# config/alerts.example.yml — scheduled email alert settings.
#
# Copy to config/alerts.yml and edit. The real file is gitignored, like
# config/profile.yml and config/lanes.yml, because it carries your address.
#
# Credentials do NOT live here. Sending reads GMAIL_CLIENT_ID,
# GMAIL_CLIENT_SECRET and GMAIL_SEND_REFRESH_TOKEN from .env — see
# docs/ALERTS.md for minting a send-scoped token.

alerts:
  # false stops the scheduled mail; the scan still runs. `--test`, `--dry-run`
  # and `--seed` still work, because each is someone asking for it now.
  enabled: true

  # Where the alert goes. `node notify-email.mjs --to x@y.com` overrides it.
  to: ""

  # Only postings scoring at or above this appear in the mail. 42 is the
  # "strong" band floor; 0 sends every new posting. Everything is on the
  # attached page regardless — this filters the mail, not the pipeline.
  min_match: 42

  # Rows per table. Overflow is reported as a count, not dropped silently.
  max_rows: 15

  # A run with nothing new sends no mail at all. Set false for a daily
  # proof-of-life message instead.
  quiet_if_empty: true

  # Attach output/pipeline-artifact.html (~400KB, self-contained, opens
  # interactive in a browser). The inline table in the message body is a
  # separate static rendering — mail clients strip the page's script and CSS.
  attach_artifact: true

  # Link to the published artifact. Optional: a scheduled node run cannot
  # republish it, so this points at the last version published from a Claude
  # session and may lag the attachment.
  artifact_url: ""

  # Google Calendar events for the few postings worth an evening slot
  # (calendar-alert.mjs, run by scripts/alert.cmd before the mail). Every rule
  # must pass. Needs GCAL_REFRESH_TOKEN: `node scripts/mint-gmail-token.mjs
  # --calendar`. Preview with `node calendar-alert.mjs --dry-run`.
  calendar:
    enabled: false
    min_match: 65
    # Word-matched against the company name ("Anduril" takes "Anduril
    # Industries", "Meta" does not take "Metabase"). Empty means any company.
    companies: []
    # Word-matched against the title and the lane keywords it hit. Empty means any.
    keywords: []
    # A host and its subdomains.
    exclude_hosts: [linkedin.com]
    # Today at this time in time_zone, or tomorrow once today's has passed.
    at: "21:00"
    minutes: 30
    time_zone: America/Los_Angeles
    calendar_id: primary
